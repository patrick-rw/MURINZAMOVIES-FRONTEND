<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access - MOVIE SHOW</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-theme text-white font-sans min-h-screen flex items-center justify-center p-4">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="w-full max-w-md bg-[#1e293b] p-8 rounded-xl shadow-2xl border border-gray-700">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center font-bold text-2xl mx-auto mb-4 shadow-lg shadow-blue-500/30">GS</div>
            <h1 class="text-2xl font-bold text-white">Admin Access</h1>
            <p class="text-gray-400 text-sm mt-1">Restricted Area. Please log in.</p>
        </div>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-300">Username</label>
                <input type="text" id="username" required class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 focus:outline-none transition-colors">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-300">Password</label>
                <input type="password" id="password" required class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 focus:outline-none transition-colors">
            </div>
            
            <p id="loginError" class="text-red-500 text-sm text-center hidden font-bold">Invalid Credentials!</p>
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 font-bold py-3 px-4 rounded transition duration-200 mt-2 shadow-lg shadow-blue-600/30">Login</button>
        </form>
    </div>

    <!-- ADMIN PANEL (Hidden by default) -->
    <div id="adminPanel" class="w-full max-w-4xl bg-[#1e293b] p-6 md:p-8 rounded-xl shadow-2xl border border-gray-700 hidden my-8">
        <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
            <h1 class="text-2xl font-bold text-blue-400">Upload New Movie</h1>
            <button onclick="logout()" class="text-sm bg-red-600 hover:bg-red-700 px-4 py-2 rounded transition">Logout</button>
        </div>
        
        <form id="addMovieForm" class="space-y-5">
            <div class="grid md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-300">Movie Title *</label>
                    <input type="text" id="title" required class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-300">Category *</label>
                    <input type="text" id="category" required placeholder="e.g., Action, Trending, Indian" class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 focus:outline-none">
                </div>
            </div>

            <div class="grid md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-300">Genre</label>
                    <input type="text" id="genre" placeholder="e.g., Sci-Fi, Romance, Horror" class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-300">Poster URL (GitHub Raw Link) *</label>
                    <input type="url" id="posterUrl" required placeholder="https://raw.githubusercontent.com/..." class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-gray-300">Description / Summary</label>
                <textarea id="description" rows="3" class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 focus:outline-none"></textarea>
            </div>

            <!-- Links Inputs (Part A) -->
            <div class="grid md:grid-cols-2 gap-5 bg-gray-900/50 p-4 rounded-lg border border-gray-700">
                <div>
                    <label class="block text-sm font-medium mb-1 text-blue-300">Watch Link (Part A)</label>
                    <input type="url" id="watchUrl" placeholder="https://..." class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-green-300">Download Link (Part A)</label>
                    <input type="url" id="downloadUrl" placeholder="https://..." class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 focus:outline-none text-sm">
                </div>
            </div>

            <div class="flex items-center space-x-3 pt-2">
                <input type="checkbox" id="isTrending" class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500 bg-gray-700 border-gray-600">
                <label for="isTrending" class="text-sm font-medium text-gray-300">Mark as Trending (Appears in Hero Banner)</label>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded transition duration-200 mt-6 shadow-lg shadow-blue-600/30">Upload Movie to Database</button>
        </form>

        <div id="message" class="mt-4 text-center font-bold hidden p-3 rounded border"></div>
    </div>

    <!-- LOGIN LOGIC -->
    <script>
        // --- SET YOUR ADMIN CREDENTIALS HERE ---
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "movie123"; 
        
        if(sessionStorage.getItem('isAdmin') === 'true') {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if(user === ADMIN_USER && pass === ADMIN_PASS) {
                sessionStorage.setItem('isAdmin', 'true');
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        });

        function logout() {
            sessionStorage.removeItem('isAdmin');
            window.location.reload();
        }
    </script>

    <!-- UPLOAD LOGIC -->
    <script src="js/admin.js"></script>
</body>
</html>
