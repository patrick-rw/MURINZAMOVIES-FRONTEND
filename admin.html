<!-- frontend/admin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - MOVIE SHOW</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-3xl mx-auto bg-gray-800 p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-6 text-blue-400">Add New Movie</h1>
        
        <form id="addMovieForm" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Title</label>
                    <input type="text" id="title" required class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Category</label>
                    <select id="category" class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 outline-none">
                        <option value="Trending">Trending</option>
                        <option value="Indian">Indian</option>
                        <option value="Action">Action</option>
                        <option value="Horror">Horror</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Poster URL (GitHub Raw Link)</label>
                <input type="text" id="posterUrl" required placeholder="https://raw.githubusercontent.com/..." class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Description</label>
                <textarea id="description" rows="3" class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 outline-none"></textarea>
            </div>

            <!-- Links Management (Simplified for example) -->
            <div>
                <label class="block text-sm font-medium mb-1">Watch Link (Part A)</label>
                <input type="text" id="watchUrl" placeholder="https://..." class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 outline-none">
            </div>

            <div class="flex items-center space-x-2 pt-2">
                <input type="checkbox" id="isTrending" class="w-4 h-4 text-blue-600 rounded">
                <label for="isTrending" class="text-sm font-medium">Mark as Trending</label>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded transition duration-200 mt-4">Upload Movie</button>
        </form>

        <div id="message" class="mt-4 text-center text-green-400 hidden">Movie added successfully!</div>
    </div>

    <script>
        document.getElementById('addMovieForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const movieData = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                posterUrl: document.getElementById('posterUrl').value,
                description: document.getElementById('description').value,
                isTrending: document.getElementById('isTrending').checked,
                watchLinks: [{ quality: "Part A", url: document.getElementById('watchUrl').value }]
            };

            try {
                const res = await fetch('https://your-backend.onrender.com/api/movies', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(movieData)
                });
                
                if (res.ok) {
                    document.getElementById('message').classList.remove('hidden');
                    e.target.reset();
                    setTimeout(() => document.getElementById('message').classList.add('hidden'), 3000);
                }
            } catch (err) {
                alert('Error adding movie');
            }
        });
    </script>
</body>
</html>
