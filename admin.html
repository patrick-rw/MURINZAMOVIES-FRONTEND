<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - MOVIE SHOW</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-4 md:p-8 font-sans">
    <div class="max-w-4xl mx-auto bg-gray-800 p-6 md:p-8 rounded-lg shadow-2xl">
        <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
            <h1 class="text-2xl font-bold text-blue-400">Add New Movie</h1>
            <a href="index.html" class="text-sm text-gray-400 hover:text-white">&larr; Back to Site</a>
        </div>
        
        <form id="addMovieForm" class="space-y-5">
            <div class="grid md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-300">Title</label>
                    <input type="text" id="title" required class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-300">Category</label>
                    <input type="text" id="category" required placeholder="e.g., Action, Trending" class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 focus:outline-none">
                </div>
            </div>

            <div class="grid md:grid-cols-2 gap-5">
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-300">Genre</label>
                    <input type="text" id="genre" placeholder="e.g., Sci-Fi, Romance" class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-300">Poster URL (GitHub Raw Link)</label>
                    <input type="url" id="posterUrl" required placeholder="https://raw.githubusercontent.com/..." class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-gray-300">Description</label>
                <textarea id="description" rows="3" class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 focus:outline-none"></textarea>
            </div>

            <!-- Simple Links Inputs (Part A) -->
            <div class="grid md:grid-cols-2 gap-5 bg-gray-900 p-4 rounded border border-gray-700">
                <div>
                    <label class="block text-sm font-medium mb-1 text-blue-300">Watch Link (e.g., Part A)</label>
                    <input type="url" id="watchUrl" placeholder="https://..." class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 focus:outline-none text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-green-300">Download Link (e.g., Part A)</label>
                    <input type="url" id="downloadUrl" placeholder="https://..." class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:border-blue-500 focus:outline-none text-sm">
                </div>
            </div>

            <div class="flex items-center space-x-3 pt-2">
                <input type="checkbox" id="isTrending" class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500 bg-gray-700 border-gray-600">
                <label for="isTrending" class="text-sm font-medium text-gray-300">Mark as Trending (Appears in Hero Banner)</label>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded transition duration-200 mt-6 shadow-lg">Upload Movie</button>
        </form>

        <div id="message" class="mt-4 text-center text-green-400 font-bold hidden p-3 bg-green-900/30 rounded border border-green-800"></div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
